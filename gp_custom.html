<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="viewport" content="width=852, user-scalable=no">

<title>Gamepad UI for iOS</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

    :root{
    --main-bg-color:#4a2028;
}

body{
    font-family:'Inter',sans-serif;
    background-color:var(--main-bg-color);
    color:#e2e8f0;

    display:flex;
    justify-content:center;
    align-items:center;

    width:852px;
    height:393px;

    margin:0;
    overflow:hidden;

    transform-origin:top left;

    touch-action:manipulation;
    
}

/* 共通 */

.page-container{
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
    height:100%;
    transition:filter 0.3s ease;
    position:relative;
}

.page-container.hidden{
    display:none;
}

.page-container.menu-open{
    filter:blur(5px);
}

/* 左情報エリア */

.left-info-panel{
    width:380px;
    height:350px;

    background:#253041;

    border-radius:24px;

    padding:20px;

    display:flex;
    flex-direction:column;

    gap:12px;

    box-shadow:
        0 10px 15px -3px rgba(0,0,0,0.1),
        0 4px 6px -2px rgba(0,0,0,0.05);
}

.info-title{
    font-size:28px;
    font-weight:bold;
    color:#63b3ed;
    text-shadow:0 0 10px #63b3ed;
}

.status-card{
    flex:1;

    background:rgba(0,0,0,0.35);
    border-radius:18px;
    padding:18px;

    display:flex;
    flex-direction:column;
    gap:14px;
}

.top-status{
    flex-direction:row;
    gap:20px;
}


.odom-area{
    width:50%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:14px;
}


.controller-area{
    width:50%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:10px;

    background:rgba(0,0,0,0.25);
    border-radius:14px;
    padding:15px;
}


.controller-area #controller-info{
    font-size:18px;
    color:#00ffff;
    font-weight:bold;
    text-shadow:0 0 8px #00ffff;

    word-break:break-word;
}

.status-row{
    display:flex;
    justify-content:space-between;
    align-items:center;

    font-size:22px;
    font-weight:bold;
}

.status-label{
    color:#cbd5e0;
}

.status-value{
    min-width:120px;
    text-align:right;
}

.controller-box{
    margin-top:auto;

    background:rgba(0,0,0,0.35);

    border-radius:18px;

    padding:18px;

    display:flex;
    flex-direction:column;
    gap:10px;
}

.controller-title{
    font-size:18px;
    color:#63b3ed;
    font-weight:bold;
}

#controller-info{
    font-size:18px;
    color:#00ffff;
    font-weight:bold;
    text-shadow:0 0 8px #00ffff;

    width:100%;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

/* ステータス色 */

.text-green-400{
    color:#00ff66 !important;
    text-shadow:0 0 8px #00ff66;
}

.text-red-400{
    color:#ff4040 !important;
    text-shadow:0 0 8px #ff4040;
}

.text-gray-400{
    color:#cbd5e0 !important;
}

/* GAMEPAD */

.main-layout{
    width:830px;
    height:350px;

    display:flex;
    gap:20px;
}

.gamepad-container{
    display:flex;
    justify-content:space-between;
    align-items:center;

    width:430px;
    height:350px;

    padding:14px;

    background-color:#2d3748;

    border-radius:24px;

    box-shadow:
        0 10px 15px -3px rgba(0,0,0,0.1),
        0 4px 6px -2px rgba(0,0,0,0.05);
}

.side{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:24px;
    width:160px;
}

.middle{
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:center;
    height:100%;
    width:70px;
    padding-top:20px;
}

.stick-base{
    width:70px;
    height:70px;
    background-color:#4a5568;
    border-radius:50%;
    position:relative;
    border:2px solid #1a202c;

    margin-top:40px;
}

.stick-dot{
    width:34px;
    height:34px;
    background-color:#a0aec0;
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    transition:transform 0.05s linear;
}

.button{
    width:34px;
    height:34px;
    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-weight:bold;

    border:2px solid #1a202c;

    background-color:#4a5568;

    transition:all 0.1s ease;

    user-select:none;

    color:#ffffff;

    text-shadow:0 0 10px #ffffff;

    font-size:14px;
}

.button.pressed{
    transform:scale(0.9);

    background-color:#00ff99;

    color:#000000;

    text-shadow:none;

    box-shadow:0 0 15px #00ff99;
}

.d-pad{
    display:grid;
    grid-template-columns:repeat(3,26px);
    grid-template-rows:repeat(3,26px);
    gap:2px;
}

.d-pad .button{
    width:26px;
    height:26px;
    border-radius:4px;
    font-size:12px;
}

#d-up{grid-column:2;grid-row:1;}
#d-left{grid-column:1;grid-row:2;}
#d-right{grid-column:3;grid-row:2;}
#d-down{grid-column:2;grid-row:3;}

.action-buttons{
    display:grid;
    grid-template-columns:repeat(3,34px);
    grid-template-rows:repeat(3,34px);
    gap:4px;
}

#btn-tri{grid-column:2;grid-row:1;}
#btn-sq{grid-column:1;grid-row:2;}
#btn-cir{grid-column:3;grid-row:2;}
#btn-cro{grid-column:2;grid-row:3;}

.shoulder-buttons{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    width:140px;      /* 左右同じ幅 */
}

.bumper,
.trigger{
    width:60px;
    height:32px;
    padding:0;
    border-radius:8px;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
    overflow:hidden;
}

.trigger-bar{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    background-color:#63b3ed;
    height:0;
    transition:height 0.1s linear;
}

.system-buttons{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.system-buttons .button{
    width:40px;
    height:24px;
    border-radius:8px;
    font-size:9px;
}

/* MENU */

#menu-icon{
    position:fixed;
    top:20px;
    left:20px;
    z-index:1001;
    cursor:pointer;
    width:30px;
    height:22px;
}

#menu-icon span{
    display:block;
    position:absolute;
    height:3px;
    width:100%;
    background:#ffffff;
    border-radius:3px;
    left:0;
    transition:.25s ease-in-out;
    box-shadow:0 0 8px #ffffff;
}

#menu-icon span:nth-child(1){top:0;}

#menu-icon span:nth-child(2),
#menu-icon span:nth-child(3){top:9px;}

#menu-icon span:nth-child(4){top:18px;}

#menu-icon.open span:nth-child(1),
#menu-icon.open span:nth-child(4){
    top:9px;
    width:0%;
    left:50%;
}

#menu-icon.open span:nth-child(2){
    transform:rotate(45deg);
}

#menu-icon.open span:nth-child(3){
    transform:rotate(-45deg);
}

#side-menu{
    position:fixed;
    top:0;
    left:-370px;
    width:320px;
    height:100%;
    background:#2d3748;
    padding:24px;
    z-index:1000;
    transition:left 0.4s ease-in-out;
    box-shadow:2px 0 10px rgba(0,0,0,0.5);
    overflow-y:auto;
}

#side-menu.open{
    left:0;
}

#overlay{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:rgba(0,0,0,0.6);
    z-index:999;
    display:none;
}

#overlay.active{
    display:block;
}

.nav-link{
    display:block;
    padding:12px 16px;
    margin-bottom:8px;
    border-radius:8px;
    cursor:pointer;
    transition:background-color 0.2s;
    color:#ffffff;
    font-weight:bold;
}

.nav-link:hover{
    background-color:#4a5568;
}

.nav-link.active{
    background-color:#00aaff;
    box-shadow:0 0 10px #00aaff;
}

/* CUSTOM BUTTON */
.custom-controls-container{
    position:relative;
}

.lift-buttons{
    position:absolute;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    gap:15px;
}

.lift-buttons .custom-button{
    width:215px;
    height:90px;
}
.custom-controls-container{
    display:flex;
    flex-direction:row;
    justify-content:center;
    align-items:center;
    gap:40px;
    width:832px;
    height:373px;
    padding:10px;
    background-color:#2d3748;
    border-radius:24px;
}

#custom-controls-page{
    gap:20px;
}

#custom-controls-page .left-info-panel{
    flex-shrink:0;
}

#custom-controls-page .custom-controls-container{
    width:430px;
    height:350px;
    padding:14px;
    flex-shrink:0;
    box-sizing:border-box;
}

.custom-button-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    width:450px;
    align-content:start;
}

.custom-button{
    width:215px;
    height:90px;
    position:relative;
    background-color:#4a5568;
    border-radius:16px;
    border:2px solid #1a202c;
    transition:all 0.1s ease;
    display:flex;
    justify-content:center;
    align-items:center;
    user-select:none;
    touch-action:none;
}

.custom-button.pressed{
    transform:scale(0.97);
    background-color:#00ff99;
    box-shadow:0 0 20px #00ff99;
}

.custom-button span{
    font-size:30px;
    font-weight:bold;
    color:#ffffff;
    text-shadow:0 0 12px #ffffff;
}

.custom-button.pressed span{
    color:#000000;
    text-shadow:none;
}

/* =========================
   CAMERA PAGE
========================= */

.camera-container{
    width:832px;
    height:373px;

    background:#2d3748;

    border-radius:24px;

    padding:10px;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;

    box-sizing:border-box;
}

.camera-stream{
    width:100%;
    height:100%;

    object-fit:contain;

    border-radius:16px;

    background:#000000;
}

/* カメラ基準線 */

.camera-crosshair{
    position:absolute;

    top:10px;
    left:10px;
    right:10px;
    bottom:10px;

    pointer-events:none;
}

.vertical-line{
    position:absolute;

    top:0;
    bottom:0;

    left:50%;

    width:2px;

    background:#00ff00;

    transform:translateX(-50%);
}

.horizontal-line{
    position:absolute;

    left:0;
    right:0;

    top:50%;

    height:2px;

    background:#00ff00;

    transform:translateY(-50%);
}
</style>

    if(pingIntervalId){
        clearInterval(pingIntervalId);
    }
};

    ws.onerror=()=>{

    const infos=[
        document.getElementById('controller-info'),
        document.getElementById('custom-controller-info')
    ];

    infos.forEach(info=>{
        info.textContent="Connection Error";
        info.classList.remove('text-green-400');
        info.classList.add('text-red-400');
    });
};

    ws.onmessage=(event)=>{

        try{

            const data=JSON.parse(event.data);
            
            // オドメトリ表示
            if(data.type==='odom'){

                // ゲームパッドページ
                document.getElementById('odom-x').textContent =
                    data.x.toFixed(3);

                document.getElementById('odom-y').textContent =
                    data.y.toFixed(3);

                document.getElementById('odom-theta').textContent =
                    data.theta.toFixed(3);


                // カスタムコントロールページ
                document.getElementById('custom-odom-x').textContent =
                    data.x.toFixed(3);

                document.getElementById('custom-odom-y').textContent =
                    data.y.toFixed(3);

                document.getElementById('custom-odom-theta').textContent =
                    data.theta.toFixed(3);
            }
            
            if(data.type==='pong'){

                clearTimeout(pingTimeout);

                const latency=
                    performance.now()-data.timestamp;

                updateStatusDisplay(
                    'pingValue',
                    latency.toFixed(1)+" ms",
                    latency>200
                );
            }

            else if(data.type==='mcu_ping'){

                if(data.rtt!==null){

                    updateStatusDisplay(
                        'mcuPingValue',
                        data.rtt.toFixed(1)+" ms",
                        data.rtt>50
                    );

                }else{

                    updateStatusDisplay(
                        'mcuPingValue',
                        'Timeout',
                        true
                    );
                }
            }

        }catch(e){

            console.error(e);
        }
    };
}

function sendPing(){

    if(ws && ws.readyState===WebSocket.OPEN){

        clearTimeout(pingTimeout);

        pingTimeout=setTimeout(()=>{

            updateStatusDisplay(
                'pingValue',
                'Timeout',
                true
            );

        },200);

        ws.send(JSON.stringify({

            type:'ping',
            timestamp:performance.now()
        }));
    }
}

/* =========================
   送信処理
========================= */

function transmitDataLoop(){

    if(!ws || ws.readyState!==WebSocket.OPEN){

        updateStatusDisplay('txInterval','0 Hz',true);

        return;
    }

    const now=performance.now();

    transmissionTimestamps.push(now);

    transmissionTimestamps=
        transmissionTimestamps.filter(t=>now-t<1000);

    updateStatusDisplay(
        'txInterval',
        transmissionTimestamps.length.toString()+" Hz",
        false
    );

    const gamepadData={
    controllerType:"0",

    buttons:currentGamepad
        ? currentGamepad.buttons.map(b=>({
            pressed:b.pressed,
            value:b.value
        }))
        : [],

    axes:currentGamepad
        ? currentGamepad.axes
        : [0,0,0,0],

    customButtons:customButtonStates
};

    ws.send(JSON.stringify(gamepadData));
}

/* =========================
   GAMEPAD VISUAL
========================= */

function setPressed(id,pressed){

    const el=document.getElementById(id);

    if(!el)return;

    if(pressed){
        el.classList.add('pressed');
    }else{
        el.classList.remove('pressed');
    }
}

function moveStick(dotId,x,y){

    const dot=document.getElementById(dotId);

    const maxMove=16;

    const moveX=x*maxMove;
    const moveY=y*maxMove;

    dot.style.transform=
        `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
}

function updateGamepadVisual(){

    const gamepads=navigator.getGamepads();

    if(!gamepads)return;

    const gp=gamepads[0];

    currentGamepad=gp;

    const infos=[
    document.getElementById('controller-info'),
    document.getElementById('custom-controller-info')
];

if(!gp){

    infos.forEach(info=>{
        info.textContent="Not Connected";
        info.classList.remove('text-green-400');
        info.classList.add('text-red-400');
    });

    requestAnimationFrame(updateGamepadVisual);
    return;
}

infos.forEach(info=>{
    info.textContent="Connected";
    info.classList.remove('text-red-400');
    info.classList.add('text-green-400');
});

    moveStick('left-stick-dot',gp.axes[0],gp.axes[1]);
    moveStick('right-stick-dot',gp.axes[2],gp.axes[3]);

    setPressed('d-up',gp.buttons[12]?.pressed);
    setPressed('d-down',gp.buttons[13]?.pressed);
    setPressed('d-left',gp.buttons[14]?.pressed);
    setPressed('d-right',gp.buttons[15]?.pressed);

    setPressed('btn-cro',gp.buttons[0]?.pressed);
    setPressed('btn-cir',gp.buttons[1]?.pressed);
    setPressed('btn-sq',gp.buttons[2]?.pressed);
    setPressed('btn-tri',gp.buttons[3]?.pressed);

    setPressed('l1',gp.buttons[4]?.pressed);
    setPressed('r1',gp.buttons[5]?.pressed);

    const l2=gp.buttons[6]?.value || 0;
    const r2=gp.buttons[7]?.value || 0;

    document.getElementById('l2-bar').style.height=`${l2*100}%`;
    document.getElementById('r2-bar').style.height=`${r2*100}%`;

    setPressed('l2',l2>0.1);
    setPressed('r2',r2>0.1);

    setPressed('btn-share',gp.buttons[8]?.pressed);
    setPressed('btn-options',gp.buttons[9]?.pressed);
    setPressed('btn-ps',gp.buttons[16]?.pressed);

    requestAnimationFrame(updateGamepadVisual);
}

/* =========================
   カスタムボタン
========================= */

function setupCustomButtons(){

    for(let i=1;i<=10;i++){

        const button=document.getElementById(`custom-btn-${i}`);

        if(!button) continue;

        const updateState=(isPressed)=>{

    customButtonStates[i-1]=isPressed;

    if(isPressed){

        button.classList.add('pressed');

        // 赤ボタン
        if(i===2){
            setBackgroundColor('red');
        }

        // 青ボタン
        if(i===1){
            setBackgroundColor('blue');
        }

    }else{

        button.classList.remove('pressed');
    }
};

        button.addEventListener('mousedown',(e)=>{
            e.preventDefault();
            updateState(true);
        });

        button.addEventListener('mouseup',(e)=>{
            e.preventDefault();
            updateState(false);
        });

        button.addEventListener('mouseleave',(e)=>{
            e.preventDefault();
            updateState(false);
        });

        button.addEventListener('touchstart',(e)=>{
            e.preventDefault();
            updateState(true);
        },{passive:false});

        button.addEventListener('touchend',(e)=>{
            e.preventDefault();
            updateState(false);
        },{passive:false});

        button.addEventListener('touchcancel',(e)=>{
            e.preventDefault();
            updateState(false);
        },{passive:false});
    }
}

/* =========================
   UI SCALE
========================= */

function scaleUI(){

    const targetWidth=852;
    const targetHeight=393;

    const scale=Math.min(
        window.innerWidth/targetWidth,
        window.innerHeight/targetHeight
    );

    document.body.style.transform=`scale(${scale})`;

    document.body.style.transformOrigin='top left';

    const left=(window.innerWidth-(targetWidth*scale))/2;
    const top=(window.innerHeight-(targetHeight*scale))/2;

    document.body.style.position='absolute';

    document.body.style.left=`${left}px`;
    document.body.style.top=`${top}px`;
}
